[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyadapter"
version = "0.1.0"
description = "Provide a pipeline Python interface for harmony scene build and export"
requires-python = ">=3.10"

dependencies = [
    "psd-tools>=1.9.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]